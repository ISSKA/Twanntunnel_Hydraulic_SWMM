const ph = H - m.top - m.bottom;

const sy = d => m.top + ph - d / maxD * ph;
function el(name, attrs = {}, text = '') {
  const n = document.createElementNS('http://www.w3.org/2000/svg', name);
  for (const [k,v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text) n.textContent = text;
  svg.appendChild(n);
  return n;
}
function title(parent, text) {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'title');
  t.textContent = text;
  parent.appendChild(t);
}

  el('text', {class:'tick', x:x, y:m.top+ph+24, 'text-anchor':'middle'}, String(z));
}
for (let d = 0; d <= maxD + 1e-9; d += 0.5) {
  const y = sy(d);

  el('text', {class:'tick', x:m.left-10, y:y+4, 'text-anchor':'end'}, d.toFixed(d % 1 ? 1 : 0));
}
el('rect', {class:'axis', x:m.left, y:m.top, width:pw, height:ph, fill:'none'});
for (const r of data.rows) {

for (const b of data.bins) {

  el('line', {class:'median', x1:x-bw/2, y1:sy(b.median), x2:x+bw/2, y2:sy(b.median)});
}
const meanPath = data.bins.map((b,i) => `${i ? 'L' : 'M'}${sx(b.z_mid).toFixed(1)},${sy(b.mean).toFixed(1)}`).join(' ');

for (const b of data.bins) {
